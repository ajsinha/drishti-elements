[pytest]
# no hidden folders: no .pytest_cache at the repository's root.
addopts = -p no:cacheprovider
markers =
    static: a quick file check (reads files, starts no browser): the gate runs it
    browser: a browser test
    spread: a browser test, spread over the workers by test
    budget: a performance-budget test (a rate or a time limit): never run under parallel load; tools/run_tests.py runs these serially after the parallel run
