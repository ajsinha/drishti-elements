name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r tests/requirements.txt
      - run: playwright install --with-deps chromium
      - run: python3 tools/elements/build.py --check && python3 tools/docs/elements_api.py --check && python3 tools/license_headers.py
      - run: node --test tests/elements/*.test.mjs
      - run: python3 -m pytest -q tests -n 4      # one worker per core of the hosted runner: the browser budgets (frame time, the 5,000-node layout) hold
      - run: python3 tools/elements/cli.py dist --out dist
